<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#20151e">
<title>CRC Potchefstroom · Ministry of Helps</title>
<style>
:root{color-scheme:dark;--paper:#1a141c;--panel:#2b202c;--text:#fff0f5;--muted:#dec5d2;--red:#992343;font:16px/1.5 system-ui,sans-serif}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--paper);color:var(--text)}
header,main,footer{width:min(100% - 2rem,1020px);margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1rem 0;border-bottom:1px solid #70445a}
header strong{letter-spacing:.13em}.muted,small{color:var(--muted)}main{padding-block:1.2rem 3rem}h1,h2,p{margin:.2rem 0 .8rem}h1{font-size:clamp(2rem,6vw,3.75rem);line-height:1.05}h2{font-size:1.25rem}
.hero-photo{position:relative;overflow:hidden;display:grid;place-content:center;min-height:clamp(225px,42vw,380px);background:linear-gradient(120deg,#42162b,#a02047);border-radius:18px;margin-bottom:1rem}
.hero-photo>strong{font-size:clamp(4rem,17vw,9rem);line-height:1;letter-spacing:-.1em;padding-right:.1em}
button,input,select,textarea{font:inherit}button{min-height:44px;border:1px solid #a0778a;border-radius:8px;padding:.5rem .85rem;color:var(--text);background:#352636;cursor:pointer}.primary,[aria-current=page]{background:var(--red);border-color:#df7292}
button:disabled{opacity:.6;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #ffd1de;outline-offset:2px}
nav,.actions{display:flex;flex-wrap:wrap;gap:.45rem;margin-bottom:1rem}section,article{min-width:0}
.panel,#auth,dialog{background:var(--panel);border:1px solid #684457;border-radius:14px;padding:clamp(1rem,4vw,1.8rem);margin-bottom:.75rem}
#auth{max-width:34rem;margin-inline:auto}#auth-switch{margin:.7rem 0}form{display:grid;gap:.7rem}label{display:grid;gap:.25rem}
input:not([type=radio]),select,textarea{width:100%;padding:.52rem;background:#190f19;color:var(--text);border:1px solid #936b7e;border-radius:6px}
fieldset{border:1px solid #936b7e;border-radius:8px}fieldset label{display:flex;gap:.5rem;align-items:center;min-height:44px}
dialog{color:var(--text);width:min(calc(100% - 2rem),36rem);max-height:84dvh;margin:auto}dialog::backdrop{background:#100910b5}details{padding:.5rem;border-bottom:1px solid #795064}summary{cursor:pointer}
.module57{width:100%;text-align:left;display:flex;align-items:center;gap:1rem;margin:.45rem 0}.module57 small{display:block}progress{width:100%;accent-color:#dc557a}
#status{position:fixed;right:1rem;bottom:1rem;z-index:8;max-width:min(85vw,28rem);background:#482639;color:#fff;padding:.7rem 1rem;border-radius:8px}#status:empty{display:none}
</style>
<script src="./potch-live.js" defer></script>
</head>
<body>
<header><strong>CRC · MINISTRY OF HELPS</strong><button type="button" id="jump" data-auth="signin">Sign in</button></header>
<main>
<section id="welcome">
 <div class="hero-photo"><strong aria-hidden="true">MOH</strong></div>
 <h1>Made to serve.</h1><p>CRC Potchefstroom</p>
 <div class="actions"><button type="button" class="primary" data-auth="signup">Create account</button><button type="button" data-auth="signin">Sign in</button></div>
</section>
<section id="auth" hidden>
 <button type="button" id="back-home">Home</button>
 <div id="auth-switch" class="actions"><button type="button" data-auth="signin">Sign in</button><button type="button" data-auth="signup">Create account</button></div>
 <h1 id="auth-title">Your account</h1><p id="auth-copy"></p>
 <form id="login">
  <label>Email <input name="email" type="email" required autocomplete="email"></label>
  <label>Password <input name="password" type="password" required autocomplete="current-password"></label>
  <label id="confirm-label" hidden>Confirm password <input name="confirm" type="password" autocomplete="new-password"></label>
  <button id="auth-submit" class="primary" type="submit">Sign in</button>
  <button id="forgot" type="button">Forgot password?</button>
 </form>
 <div id="verify" hidden><span id="verified" hidden></span></div>
</section>
<section id="app" hidden>
 <nav id="nav" aria-label="Member workspace">
  <button type="button" data-page="home">Home</button><button type="button" data-page="academy">Academy</button>
  <button type="button" data-page="poll">Sunday availability</button><button type="button" data-page="notifications">Alerts</button>
  <button type="button" data-page="profile">Profile</button><button type="button" id="sign-out">Sign out</button>
 </nav>
 <section id="home">
  <h1 id="greeting"></h1>
  <article class="panel"><h2>Upcoming service</h2><p id="service-status"></p></article>
  <article class="panel"><h2>Sunday availability</h2><p id="availability-status"></p><button type="button" data-page="poll">Open availability</button></article>
 </section>
 <section id="academy" hidden><div id="academy-root"></div></section>
 <section id="poll" hidden>
  <h1>Sunday availability</h1><p id="poll-date"></p>
  <form id="poll-form">
   <input type="hidden" name="sunday">
   <fieldset><legend>When can you serve?</legend>
    <label><input required type="radio" name="choice" value="AM service"> AM service</label>
    <label><input type="radio" name="choice" value="PM service"> PM service</label>
    <label><input type="radio" name="choice" value="Both services"> Both services</label>
    <label><input type="radio" name="choice" value="Not serving"> Unavailable</label>
   </fieldset>
   <label id="reason-label" hidden>Reason <textarea name="reason" rows="3"></textarea></label>
   <button type="submit" class="primary">Save availability</button>
  </form>
 </section>
 <section id="notifications" hidden><div id="notifications-root"></div></section>
 <section id="profile" hidden><h1 id="member-name"></h1><p id="member-group"></p><p id="member-role"></p><div class="actions"><button type="button" id="edit-profile">Edit display name</button><button type="button" id="edit-account">Account settings</button></div></section>
</section>
<dialog id="details" aria-labelledby="details-title"><button type="button" id="close-details">Close</button><h2 id="details-title"></h2><div id="details-body"></div></dialog>
</main>
<footer>CRC Potchefstroom</footer><p id="status" role="status" aria-live="polite"></p>
</body>
</html>
